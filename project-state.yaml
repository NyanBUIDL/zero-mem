m9_increment_2_scope_notes: >-
  First increment that actually generates notes. Five authoritative surfaces
  render deterministically from authorized M4 project-memory records into a
  temporary-vault managed root: Project Home, Project State, Decision,
  Requirement, Verification. New modules render.py (pure deterministic
  rendering — closed frontmatter field set in fixed order, every
  content-derived string folded to a single line then context-escaped, no wall
  clock, no randomness, no filesystem, no authorization), eligibility.py
  (sensitivity + lifecycle predicate over a record's own fields, canonical
  vocabulary, ceiling internal, secret never projected, raw/observed/candidate/
  deleted excluded), engine.py (orchestration only — M5 AuthorizedReadService
  consulted per resource_type BEFORE any read or render, then eligibility, then
  the writer; content-level secret-pattern backstop withholds a whole note),
  and writer.py (M9.1 path safety plus atomic same-directory temp, fsync,
  os.replace; never overwrites an existing file — a collision is reported and
  the bytes are left identical). Memory is DATA never instruction: content can
  never open a frontmatter block, heading, callout, fence, wiki link, embed,
  tag, or raw HTML, because content never selects structure and never reaches
  the start of a line. verification_status is copied, never computed — no
  claim-to-verification promotion; a Decision emits null rather than inferring
  from a linked verification. Supersession renders from explicit supersedes_id/
  replaced_by only, never from effective_at, note order, mtime, or M8 recency;
  a conflicted record renders a warning and no winner is chosen. A denial
  produces no note, no stub, no count, and no placeholder — no existence
  signal. Fail-open defect in this increment's OWN new code found and fixed:
  eligibility folded any non-string sensitivity/lifecycle to None and treated
  None as "field absent", so sensitivity=123 / b"secret" / ["secret"] / True
  all projected, contradicting docs/plans/plan-m9.md 11.2; "not carried" is now a distinct
  sentinel from "carried but unparseable" and the latter fails closed on both
  dimensions, with mutation-proven permanent regressions. Two vacuous
  assertions corrected (an `or True` tautology, and a private-state check that
  passed only because escaping produced "secret\_state"); the M4 v9 substrate
  has no sensitivity column, so that boundary is now stated honestly by
  test_project_state_row_without_sensitivity_is_visible instead of hidden
  behind a passing assertion — M9 never invents a sensitivity it was not given.
  Cross-project fixture defect corrected: the grant now covers P only and the
  denial test carries a positive control. M9.1 security guards rescoped from a
  package glob to the M9.1 module set because they asserted M9.2 surfaces did
  not exist yet; no gate weakened, four guards ADDED, and authorization reach
  tightened so the read service now has exactly one consumer (engine.py). No
  wiki links or backlinks, no conflict navigation, no manifest, no incremental
  suppression, no retirement, no human-edit quarantine (M9.3-M9.6). Real
  operator vault and .obsidian/ untouched; every write is a tmp_path managed
  root. Canonical JSONL and SQLite immutable. Schema remains v9 — no migration.
  Zero LLM calls, zero external network calls, no Hermes core change.

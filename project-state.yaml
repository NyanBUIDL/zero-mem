m10_6_graph_and_optional_enrichment:
  status: "verified"
  objective: "Extend the M10.4/M10.5 verified corpus with a DERIVED, authorization-safe graph layer and an OPTIONAL enrichment boundary (plan §359)."
  schema_version: 10
  migration: "NONE (populates the existing migrate_10 derived zm_corpus_relations; NO migrate_11; no new table/index/column; RelationSource gained one deterministic member corpus_extraction already present in migrate_10 CHECK per plan §4)."
  graph_module: "src/corpus/graph.py (build_corpus_graph write/projection + CorpusGraphReadService authorization-first bounded read-only facade reusing M5 AuthorizedReadService)."
  deterministic_node_types: "corpus_source, corpus_unit."
  deterministic_edge_types: "source_of (corpus_source -> corpus_unit via units.source_ref); derived_from (corpus_unit -> corpus_unit via units.duplicate_of). Both are closed M8 RelationType members asserted by RelationSource.corpus_extraction."
  edge_set_rationale: "Plan prose referenced references/belongs_to/section_of; on inspection these are NOT in the frozen v10 unit DDL (no references/section column) and NOT in the closed RelationType enum, and no version table is persisted. Edges are therefore limited to those materializable from persisted columns, per the 'derive edges only from persisted columns + closed enum' rule. Richer linking (semantic/entity) is confined to the optional enrichment boundary (in-process derived metadata, never canonical graph authority)."
  provenance: "Every edge carries relation_source=corpus_extraction, source_ref (asserting unit), projection_version, identity_version, and a provenance_hash over deterministic inputs; rebuildable and auditable."
  authorization_before_influence: "CorpusGraphReadService reuses M5 _gate and enumerates the SAME authorized universe as corpus_unit_search; only edges whose BOTH endpoints are authorized are visible. Unauthorized nodes/edges are removed BEFORE any budget is consumed, so they cannot affect paths/ranking/truncation/degree. Structural, mirroring the M8.3 guard; no second authorization model invented."
  m6_6_isolation: "corpus_source/corpus_unit/event/artifact remain distinct authorization resources; graph adjacency grants nothing; an authorized unit adjacent to an unauthorized source exposes nothing."
  cross_scope_isolation: "same-content cross-scope units remain distinct authorized nodes; authorized-for-A request never returns/exposes scope B."
  bounds: "depth <= 2; fan_out <= 20; nodes <= 40; edges <= 80 (DEFAULT_GRAPH_BOUNDS matches M8 ceilings); exceeding a ceiling fails closed; deterministic tie-breaking by node/edge identity."
  read_only: "Graph read path issues SELECTs only; build is a separate write/projection; retrieval/graph reads mutate no canonical registry, blobs, derived tables, memory JSONL, project-state, or Obsidian (test_graph_read_path_performs_no_writes)."
  rebuild: "build_corpus_graph is idempotent (same upstream -> same edge ids/hashes); rebuild_from_corpus + build_corpus_graph yields an equivalent edge set (test_rebuild_equivalent_to_projection). Canonical corpus/memory unchanged (test_canonical_corpus_unchanged_by_graph_build)."
  optional_enrichment_module: "src/corpus/enrichment.py (EnrichmentAdapter / KeywordEnrichmentAdapter / enrich_unit)."
  enrichment_principle: "OPTIONAL / LOCAL-CAPABLE / ABSENCE-SAFE / REMOVABLE / DERIVED / REBUILDABLE / NON-CANONICAL. Core works with NO adapter (enrich_unit(None) -> empty derived result). Bundled adapter is deterministic tokenization only: no LLM/network/cloud/paid API."
  enrichment_is_not_fact: "EnrichmentItem.derived is always True; output is never written to canonical/memory stores and never becomes verified_state/decision/canonical fact; provenance + adapter_version + config_hash retained."
  secret_safety: "M10.2 redactor (require_safe) applied first; secret-bearing units yield NO enrichment output (test_secret_bearing_content_not_enriched)."
  prompt_injection: "Source instruction-like text is treated as ordinary DATA tokens; gains no authority / executes no command / grants no authorization (test_prompt_injection_remains_data_in_enrichment)."
  evidence_set_integration: "Graph is supporting context only; it is NOT a replacement injection pipeline. EvidenceSet is built via the M5 AuthorizedReadService (corpus_unit_search) and preserves the same bounded budget (primary <= 5; supporting <= 3; total <= 8)."
  new_mandatory_dependencies: "none (stdlib + existing repo deps; no Neo4j/external graph DB/cloud)."
  real_corpus_rollout: "NOT INGESTED (small deterministic fixtures only)."
  m10_7_benchmark: "NOT pulled forward."
m10_7_large_corpus_rollout_benchmark_final_acceptance:
  status: "verified"
  objective: "Prove the complete M10 corpus architecture (M10.1-M10.6) against a REAL large corpus through the ACTUAL product pipeline: deterministic, authorization-safe, rebuildable, bounded, portable, and usable by Hermes via the existing EvidenceSet path (docs/plans/plan-m10.md#M10.7)."
  schema_version: 10
  migration: "NONE (no migrate_11; no new table/index/column; rollout + benchmark + acceptance only)."
  product_code_changes: "ZERO for M10.7 features. One minimal correction for a defect DISCOVERED by the rollout in a prior verified increment: src/corpus/registry.py _update_record (see prior_increment_defects)."
  real_corpus_source_label: "quantlab-papers"
  real_corpus_path_handling: "RUNTIME ONLY via operator env ZERO_MEM_M10_CORPUS_PATH. The absolute path is NOT in src/, tests, migrations, schema, default config, source identity, or corpus identity contracts, and is NOT committed."
  relocatable_logical_reference: "external_ref = '<source_label>/<path relative to corpus root>'. Verified: identical bytes registered under two different ABSOLUTE paths yield DIFFERENT source_id, while the relocatable form yields a STABLE source_id. filesystem path != knowledge identity; the corpus can be relocated without minting a new identity."
  authorization_scope: "EXPLICIT owner-approved rollout scope profile_id=zero-mem, project_id=m10-corpus-rollout, knowledge_space_id=quant-papers. Authorization is never derived from the filesystem path; the unowned (None,None,None) scope was NOT used; M5/M6.6 policy unchanged."
  source_folder_treatment: "READ-ONLY external source. Opened 'rb' only; never renamed/moved/deleted/chmod-ed; no sidecars, fixtures, or indexes written into it. All Zero-Mem state lives under its own runtime root."
  pdf_parser: "pypdf==6.15.0 installed into the project .venv ONLY (no system-wide, no sudo). Local/offline; no cloud or network extraction. Remains an OPTIONAL extra: core Zero-Mem works without it (PdfAdapter.is_available() False, TXT path unaffected). NO OCR performed."
  preflight_inventory: "601 entries scanned; 601 regular files; 601 PDFs; 0 other supported; 0 unsupported; 0 zero-byte; 0 unreadable; 0 symlinks; 0 duplicate filenames; 0 exact byte duplicates; 1,410,552,914 total source bytes (1345.2 MiB); discovery 0.013s; deterministic filesystem/stat only; zero LLM."
  first_ingest: "601 discovered / 601 supported / 601 registered / 601 extraction=complete / 0 partial / 0 image_only / 0 corrupt / 0 parser_unavailable / 0 other failures / 0 total failures. 601 sources projected; 26,144 normalized units; 4 units rejected fail-closed by the safety boundary (never stored); 601 distinct source ids; 601 logical versions; 0 exact duplicate content; 19,221 distinct unit content hashes."
  first_ingest_timing: "register 4.058s + extraction census 511.791s + projection 806.555s = 1322.404s total (~22.0 min). Throughput ~0.45 files/s, ~1.07 MiB/s of source bytes. Peak RSS (ru_maxrss) 1,208,922,112 B (~1152.9 MiB). Measured on this machine only; no general performance claim."
  storage: "blob/artifact store 1,410,991,652 B (1345.6 MiB); derived DB 149,504,000 B (142.6 MiB); derived/source ratio ~0.106."
  ingest_failure_policy: "Each source guarded independently; failures recorded with a deterministic class (read_error / register_error / extract_raise / closed ExtractionStatus). One malformed document cannot abort the rollout; failed documents are never counted as ingested. 0 failures occurred over 601 real PDFs. Many real pypdf warnings (wrong-pointing objects, duplicate /Rotate, undecodable XObjects) were tolerated without failure or silent data loss."
  second_unchanged_sync: "Re-ran the SAME unmodified source folder. new_sources=0; new_units=0; new_versions=0; digest_unchanged=True (EMPTY diff); sources/units identical at 601/26,144; 601 re-registered idempotently with the same distinct source ids. First run 1322.404s vs second 1139.316s. No duplicate corpus units, no duplicate graph, no authorization-identity duplication."
  real_corpus_not_mutated_for_update_tests: "The operator's real PDFs were NEVER edited to test versioning. M10.3 focused version tests cover that; no synthetic mutation of the real library occurred."
  duplicate_analysis: "Deterministic only: 0 exact byte duplicates across 601 sources; 26,144 units vs 19,221 distinct unit content hashes (intra/cross-source duplicate normalized units are recorded via duplicate_of, never merged). NO fuzzy/semantic duplicate detection. Shared content hash never collapsed authorization identity."
  retrieval_benchmark_core: "CORE = lexical + metadata (no semantic). 22-query deterministic set declared in benchmarks/run_m10_rollout.py BEFORE observing results, including 2 intentional no-match controls; no query added/removed after seeing scores. 20 hits / 2 no-hits; median 4.885 ms; p95 21.214 ms; max 38.501 ms; top-k bound 10; deterministic repeat over 3 rounds = PASS (byte-identical ordered unit ids). No approved latency threshold exists, so this is a MEASURED BASELINE at 601 sources / 26,144 units on this machine, not a pass/fail gate."
  retrieval_sanity: "5/5 sampled real units retrievable by their own words, plus single-term, multi-term, metadata-constrained, and no-match classes. Probe rule declared up front: first 5 purely-alphabetic tokens of length >= 4. Rationale (documented, not post-hoc tuning): real PDF extraction splits words across layout runs ('DEVIA TIONS', 'P A THWISE') and identifier tokens such as arXiv:1706.05291v3 are normalized to arxiv1706.05291v3 while the FTS tokenizer splits indexed text on ':', so a raw leading-token slice probes tokenizer asymmetry rather than retrieval (verified: 1706.05291v3 alone retrieves the unit, as do author surnames and title words). This is RETRIEVAL SANITY, not a universal answer-quality proof."
  optional_semantic: "NOT used. Corpus NOT embedded; no model downloaded; no cloud embeddings. Core M10 acceptance does not depend on semantic retrieval."
  graph: "32,377 edges projected (26,144 source_of + 6,233 derived_from) in 0.939s over the real corpus. Bounds preserved unchanged from M8/M10.6: depth<=2 (observed 2), fan_out<=20 (observed 20), nodes<=40 (observed 21), edges<=80 (observed 21). Widening fails closed: GraphReadBounds(max_nodes=41) raises graph_bounds_error:exceeds_fixed_ceiling:max_nodes. Bounds were NOT increased because the corpus is large."
  evidence_set_e2e: "25/25 invariants PASS through the real facade (M5 auth -> M10.5 retrieval -> M10.6 bounded graph -> M7 EvidenceSet): corpus-only EvidenceSet built from real corpus; memory-only remains functional; all corpus evidence typed corpus_unit with provenance; unauthorized scope retrieves ZERO units; foreign profile receives ZERO corpus evidence; instruction-like corpus text remains DATA; injection cannot raise bounds; no secret-bearing unit searchable; unauthorized graph seed leaks 0 nodes / 0 edges and flags unauthorized_hidden; derived store byte-identical (sha256) after all reads. M7 bounds preserved: primary<=5, supporting<=3, total<=8."
  hermes_e2e_smoke: "Exercised via the deterministic EvidenceSet/integration data path (the authoritative proof). No PDFs were sent through Hermes prompts; no corpus-wide LLM analysis; routine ingestion and retrieval remain zero-LLM and zero-network."
  secret_safety_rollout: "4 units rejected by the safety boundary (counted, never stored). 0 secret-bearing searchable results; 0 secret-bearing graph/enrichment results. No secret material reproduced in logs or evidence. METHOD CORRECTION recorded: an initial E2E probe reported 1 match because SQLite LIKE is case-INSENSITIVE, so '%AKIA%' matched the ordinary word 'Slo-vakia' hyphen-split across a PDF line break; corrected to case-sensitive GLOB, true count is 0. That was a defect in the verification probe, not the product, and no secret existed."
  rebuild: "Derived corpus state dropped and rebuilt from canonical registry + blobs, then the derived graph re-projected (a full DERIVED rebuild spans BOTH derived stages because rebuild_from_corpus drops zm_corpus_relations by design). Duration 755.494s. After rebuild: 601 sources / 26,144 units / 4 secret rejections / 0 extraction failures / 32,377 graph edges — all identical. Logical digest diff EMPTY; digest sha256 eeb197d2a656fc117d532f1a3630f2b0305d4937e65aa327131ffbed3b25a148. Compared on stable logical metrics (source ids, unit content hashes, counts, distinct content hashes, authorization scopes, relation count), not transaction-specific timestamps."
  canonical_preserved: "Canonical JSONL and blobs were NEVER deleted or modified during rebuild; only derived tables were dropped. Canonical memory authority unchanged. Derived SQLite remains derived/disposable/rebuildable, never canonical."
  read_only_guarantee: "Derived store byte-identical (sha256) before and after all benchmark queries, graph reads, and EvidenceSet builds. Canonical corpus_sources.jsonl, source blobs, memory JSONL, and project state untouched by read paths; writes occurred only in explicit projection/graph-build/rebuild phases."
  benchmark_harness: "benchmarks/m10_benchmark.py (reusable library, plan-designated), benchmarks/run_m10_rollout.py (rollout stages + metrics), benchmarks/run_m10_e2e.py (E2E invariants). Calls the REAL public facade at every stage; no fake benchmark path bypasses product behavior. Clearly separate from and never a substitute for the canonical suite. Runtime state written under /tmp/hermes-verify-*; no corpus files, blobs, DBs, or benchmark logs committed."
  prior_increment_defects:
    - "fix(tests) 7b32e78 — M10.2 fixture defect: tests/fixtures/corpus/sample.pdf declared xref offsets and a startxref that did not match its own byte layout (objects 4/5 declared 206/284, actually 241/340; startxref 340 vs real table 410), so a conforming parser resolved the trailer onto '5 0 obj /Type /Font' and returned corrupt_source. The fixture had ALWAYS been a corrupt PDF; invisible across M10.2-M10.6 because the only tests reading it through a real parser were SKIPPED while the optional parser was absent. PdfAdapter was CORRECT and unchanged (601/601 real PDFs -> complete). Generator now computes offsets from emitted bytes; two PERMANENT PARSER-INDEPENDENT regressions added so a skip can never re-hide it. Mutation-tested."
    - "fix(corpus) d517485 — PRODUCT defect: CorpusSourceRegistry._update_record read lines via splitlines() (unterminated) but re-inserted records via _serialize() (already newline-terminated), then re-joined with b'\n', injecting ONE BLANK LINE PER REBOUND RECORD. Registering N blob-bound sources wrote N blank lines into canonical corpus_sources.jsonl, a state its own _load() rejects with malformed_historical_line — so the CANONICAL, authoritative, rebuildable store was written unreadable and every reload/rebuild-from-canonical path broke. This is what blocked the M10.7 second-sync stage and is how the defect surfaced. Fixed by normalizing to exactly one terminator per record; append-first semantics, ordering, identity, and idempotence unchanged. Two PERMANENT regressions added (raw-bytes: no b'\n\n' and exact record count; reopen-from-disk replay preserving source_id -> blob_ref). Mutation-tested: restoring the defect fails both."
  new_mandatory_dependencies: "none"
  optional_dependency_added: "pypdf==6.15.0 (project .venv only, owner-approved, local/offline, OPTIONAL extra; core functions without it)"
  cloud_or_paid_api_required: "NO"
  obsidian_corpus_projection: "NOT PERFORMED. The ~600 PDFs were NOT projected into Obsidian; no corpus-specific Obsidian projection exists. M9 Obsidian remains a curated human-facing projection."
  real_corpus_committed_to_git: "NO (verified via git status before each commit: no PDFs, no blob store, no derived DB, no benchmark runtime data, no absolute corpus path, no .venv/caches)"
  focused_result: "152 passed, 1 skipped, 0 failed (M10.1-M10.6 focused groups, isolated HOME)"
  relevant_regression_result: "1306 passed, 0 failed (M5 authorization + M6.6 isolation + M7 injection/EvidenceSet + M8 graph authorization/bounds + secret/redaction + cross-scope isolation, isolated HOME)"
  prebinding_canonical: "3001 passed, 4 skipped, 0 failed (isolated HOME)"
  canonical_baseline_movement: "M10.6 baseline was 2996 passed / 5 skipped with the PDF parser ABSENT. Installing the optional parser un-skipped 1 valid-PDF test (+1) and 4 permanent regressions were added across the two prior-increment defect fixes (+4), giving 3001 passed. Skips 5 -> 4 as pypdf-absent skips activate and one pypdf-present skip appears. 0 failures, no deselection."
  performance_claim_discipline: "Only measured data reported. No claim of fast / instant / production-ready / scales indefinitely. M10.7 validates THIS real workload (601 PDFs, 1345.2 MiB) on THIS machine, not all future workloads, other hardware, other corpora, larger scales, non-PDF/TXT formats, OCR/scanned documents, or semantic quality."
  scope_discipline: "No M10.8 invented. No M11 created. No packaging/release engineering. No post-M10 audit performed. No corpus Obsidian projection. No schema migration. No mandatory dependency. No security invariant weakened and no M7/M8 bound increased for benchmark convenience."
  post_m10_audit: "NOT STARTED"

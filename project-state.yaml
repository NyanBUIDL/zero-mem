  authorization_before_influence: "M5 _gate runs before FTS/lexical discovery; candidate universe is scoped before ranking/scoring/fusion/truncation. FTS = discovery only; deterministic lexical score computed over authorized subset only. Hidden candidates have ZERO influence (proved by test_hidden_candidate_non_influence / test_evidenceset_hidden_candidate_preserves_composition)."

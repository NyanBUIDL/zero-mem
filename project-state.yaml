m9_increment_3_scope_notes: >-
  M9.3 PRESENTS the authorized M4 projection state; it creates, resolves,
  ranks, or infers none. Three additions over M9.2: (1) an authorized-source
  provenance block on every note (source event/trace IDs, artifact refs,
  resource_type verbatim, project/profile context, lifecycle, verification
  status, explicit supersession IDs) with no hidden source identity and fixed
  label order; (2) safe wiki links between already-authorized notes built only
  from the VERIFIED M9.1 identity/path contracts (navigation-only; hostile
  display labels whitelisted to a stable machine identity; an unresolved
  authorized reference renders a blind identical marker so existence of a
  withheld record cannot leak); (3) honest unresolved-conflict presentation
  from M4-marked-conflicted records grouped on M4's explicit conflict key,
  plus explicit supersession/history presentation (supersedes_id/
  replaced_by) that stays distinct from conflicted. New modules links.py
  (LinkRegistry/LinkTarget, deterministic safe link identity) and conflicts.py
  (authorized grouping only — conflict DETECTION is M4's authority). Pre-
  acceptance scope reconciliation (Option B) removed the unapproved public
  NoteType.CONFLICT_QUEUE: docs/plans/plan-m9.md 29 Q1 authorizes exactly eight curated
  types (conflict is the sole conflict projection type), and the M9.3 "Conflict
  Queue" index is now an aggregate NoteType.CONFLICT note (render_conflict_index)
  with a stable aggregate note_id, so M9.1 identity/filename contracts and M9.4's
  manifest still apply. The per-conflict Conflict projection is retained and
  conflict visibility is fully preserved (every authorized position, no winner,
  no total-of-all-conflicts leak). The M9.1 contract test was reverted to the
  8-type set. No manifest/incremental/retirement (M9.4), no edit-quarantine
  (M9.5). Canonical JSONL/SQLite untouched. Zero LLM, zero network, zero vault
  writes under test. Schema remains v9 — no migration.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-mem"
dynamic = ["version"]
description = "Local-first Zero-Mem evidence and memory sidecar"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "NyanBUIDL"}]
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf"]
# Optional OCR for image sources (corpus ImageAdapter). Without it images degrade to a
# single metadata unit (format, size, "ocr unavailable"); `pytesseract` + `Pillow` + the
# `tesseract` binary are also auto-detected as a fallback but are not packaged here.
ocr = ["rapidocr-onnxruntime"]
# AGPL/commercial dual-license — tooling-only (corpus PDF extraction scripts),
# NOT a runtime dependency. Do not move into core/pdf extras.
pdf-advanced = ["pymupdf"]
test = ["pytest", "PyYAML"]
ci = ["build"]

[project.scripts]
zero-mem = "zero_mem.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "zero_mem.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["zero_mem*", "src*"]
exclude = ["tests*", "benchmarks*", "config*", "scripts*", "output*", "build*", "dist*"]
namespaces = true

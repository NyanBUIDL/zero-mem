# Zero-Mem v1.6.1 additive-patch cross-platform qualification gate.
name: Zero-Mem v1.6.1 qualification

on:
  push:
    branches: [master, release/v1.6.1]
    tags: ["v1.6.1"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install declared test and build tooling
        shell: bash
        run: python -m pip install --upgrade pip build ".[test,ci]"

      - name: Configure isolated temp and HOME
        shell: bash
        run: |
          set -eo pipefail
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            mkdir -p /d/zero-mem-home /d/zero-mem-tmp
            echo "USERPROFILE=D:\\zero-mem-home" >> "$GITHUB_ENV"
            echo "HOME=D:\\zero-mem-home" >> "$GITHUB_ENV"
            echo "TMP=D:\\zero-mem-tmp" >> "$GITHUB_ENV"
            echo "TEMP=D:\\zero-mem-tmp" >> "$GITHUB_ENV"
          else
            mkdir -p /tmp/zm-tmp
            echo "TMPDIR=/tmp/zm-tmp" >> "$GITHUB_ENV"
          fi

      - name: Static checks
        shell: bash
        run: |
          set -eo pipefail
          python -m compileall -q zero_mem src scripts release_helpers
          python scripts/check_machine_state.py

      - name: Build wheel and sdist
        shell: bash
        run: python -m build --outdir dist

      - name: Verify release artifact license and metadata contract
        shell: bash
        run: |
          python tests/packaging/check_release_artifacts.py \
            dist/zero_mem-1.6.1-py3-none-any.whl \
            dist/zero_mem-1.6.1.tar.gz \
            --expected-version 1.6.1 \
            --expected-author NyanBUIDL \
            --license LICENSE \
            --notice NOTICE

      - name: Unit and integration suite
        shell: bash
        run: |
          set -eo pipefail
          python -m pytest -q tests/unit tests/integration 2>&1 | tee ci-log.txt

      - name: PKG-1 fresh-wheel acceptance
        shell: bash
        run: python tests/packaging/pkg1_wheel_acceptance.py dist/zero_mem-1.6.1-py3-none-any.whl

      - name: Junction point-lookup benchmark
        shell: bash
        run: python benchmarks/v160_junction_lookup.py | tee junction-benchmark.json

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v161-${{ matrix.os }}-py${{ matrix.python-version }}-evidence
          path: |
            ci-log.txt
            junction-benchmark.json
          if-no-files-found: error

# Historical Zero-Mem v1.6.0 cross-platform qualification gate.
name: Zero-Mem v1.6.0 qualification (manual replay)

on:
  workflow_dispatch:

jobs:
  qualify:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install declared test and build tooling
        shell: bash
        run: python -m pip install --upgrade pip build ".[test,ci]"

      - name: Configure isolated temp and HOME
        shell: bash
        run: |
          set -eo pipefail
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            mkdir -p /d/zero-mem-home /d/zero-mem-tmp
            echo "USERPROFILE=D:\\zero-mem-home" >> "$GITHUB_ENV"
            echo "HOME=D:\\zero-mem-home" >> "$GITHUB_ENV"
            echo "TMP=D:\\zero-mem-tmp" >> "$GITHUB_ENV"
            echo "TEMP=D:\\zero-mem-tmp" >> "$GITHUB_ENV"
          else
            mkdir -p /tmp/zm-tmp
            echo "TMPDIR=/tmp/zm-tmp" >> "$GITHUB_ENV"
          fi

      - name: Static checks
        shell: bash
        run: |
          set -eo pipefail
          python -m compileall -q zero_mem src scripts release_helpers
          python scripts/check_machine_state.py

      - name: Build wheel and sdist
        shell: bash
        run: python -m build --outdir dist

      - name: Unit and integration suite
        shell: bash
        run: |
          set -eo pipefail
          python -m pytest -q tests/unit tests/integration 2>&1 | tee ci-log.txt

      - name: Junction point-lookup benchmark
        shell: bash
        run: python benchmarks/v160_junction_lookup.py | tee junction-benchmark.json

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v160-${{ matrix.os }}-py${{ matrix.python-version }}-evidence
          path: |
            ci-log.txt
            junction-benchmark.json
          if-no-files-found: error

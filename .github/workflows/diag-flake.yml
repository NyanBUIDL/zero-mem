# TEMPORARY diagnostic (remove before merge): surface failing test ids as check annotations.
name: diag-flake
on:
  push:
    branches: [diag/windows-flake]
permissions:
  contents: read
jobs:
  diag:
    name: flake ${{ matrix.py }} r${{ matrix.rep }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        py: ['3.12']
        rep: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.py }}
      - shell: bash
        run: python -m pip install --upgrade pip ".[test]"
      - name: Isolated temp and HOME
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            mkdir -p /d/zero-mem-home /d/zero-mem-tmp
            echo "USERPROFILE=D:\\zero-mem-home" >> "$GITHUB_ENV"
            echo "HOME=D:\\zero-mem-home" >> "$GITHUB_ENV"
            echo "TMP=D:\\zero-mem-tmp" >> "$GITHUB_ENV"
            echo "TEMP=D:\\zero-mem-tmp" >> "$GITHUB_ENV"
          else
            mkdir -p /tmp/zm-tmp
            echo "TMPDIR=/tmp/zm-tmp" >> "$GITHUB_ENV"
          fi
      - name: Run suite
        shell: bash
        run: python -m pytest -q -rf --tb=line -p no:cacheprovider tests/unit tests/integration > ci-log.txt 2>&1 || true
      - name: Annotate failures
        if: always()
        shell: python
        run: |
          import re, collections
          lines = open("ci-log.txt", encoding="utf-8", errors="replace").read().splitlines()
          failed = [l for l in lines if l.startswith(("FAILED", "ERROR"))]
          tail = [l for l in lines if re.search(r"\d+ (passed|failed)", l)][-1:]
          def cause(l):
              m = re.match(r"(FAILED|ERROR) (\S+)(?: - (.*))?", l)
              return re.sub(r"[0-9a-f]{8,}|\d+", "N", (m.group(3) or "?")[:150]) if m else l[:150]
          groups = collections.OrderedDict()
          for l in failed:
              groups.setdefault(cause(l), []).append(l)
          print("::error title=summary::" + " | ".join(tail) + f" ; failed={len(failed)} causes={len(groups)}")
          for n, (c, ls) in enumerate(sorted(groups.items(), key=lambda kv: -len(kv[1]))[:40]):
              files = sorted({x.split("::")[0].replace("FAILED ", "").replace("ERROR ", "") for x in ls})[:4]
              first = ls[0][:260].replace("%", "%25")
              print(f"::error title=cause-{n:02d} x{len(ls)}::{c} ; files={files} ; first={first}")

# TEMPORARY diagnostic (remove before merge): surface failing test ids as check annotations.
name: diag-portability
on:
  push:
    branches: [feat/shared-memory-runtime]
permissions:
  contents: read
jobs:
  diag:
    name: diag ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - shell: bash
        run: python -m pip install --upgrade pip ".[test]"
      - name: Isolated temp and HOME
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            mkdir -p /d/zero-mem-home /d/zero-mem-tmp
            echo "USERPROFILE=D:\\zero-mem-home" >> "$GITHUB_ENV"
            echo "HOME=D:\\zero-mem-home" >> "$GITHUB_ENV"
            echo "TMP=D:\\zero-mem-tmp" >> "$GITHUB_ENV"
            echo "TEMP=D:\\zero-mem-tmp" >> "$GITHUB_ENV"
          else
            mkdir -p /tmp/zm-tmp
            echo "TMPDIR=/tmp/zm-tmp" >> "$GITHUB_ENV"
          fi
      - name: Run suite
        shell: bash
        run: python -m pytest -q -rf --tb=line -p no:cacheprovider tests/unit tests/integration > ci-log.txt 2>&1 || true
      - name: Annotate failures
        shell: python
        run: |
          import re
          lines = open("ci-log.txt", encoding="utf-8", errors="replace").read().splitlines()
          failed = [l for l in lines if l.startswith(("FAILED", "ERROR"))]
          tail = [l for l in lines if re.search(r"\d+ (passed|failed)", l)][-1:]
          chunks = [failed[i:i + 8] for i in range(0, len(failed), 8)][:9]
          print("::error title=summary::" + " | ".join(tail) + f" ; total_failed={len(failed)}")
          for n, c in enumerate(chunks):
              msg = "%0A".join(x[:380].replace("%", "%25").replace("\r", "") for x in c)
              print(f"::error title=failed-{n}::{msg}")
